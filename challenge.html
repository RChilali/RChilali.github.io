<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge | Joyeux anniversaire</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page page-form">
  <main class="shell">
    <section class="card intro-card">
      <p class="eyebrow">Étape 2 sur 3</p>
      <h1>Petit défi</h1>
      <p class="lead">Complète ce formulaire anniversaire. Si la réponse est la bonne, la surprise finale s’ouvrira automatiquement.</p>

      <form id="challengeForm" class="form-stack" novalidate>
        <label for="fullName">Ton prénom</label>
        <input id="fullName" name="fullName" type="text" placeholder="Prénom" required>

        <label for="email">Ton e-mail</label>
        <input id="email" name="email" type="email" placeholder="nom@example.com" required>

        <label for="magicAnswer">La plus jolie réponse</label>
        <input id="magicAnswer" name="magicAnswer" type="text" placeholder="le plus intelligent" required>

        <p id="challengeMessage" class="message" aria-live="polite"></p>
        <button type="submit" class="primary-btn">Valider</button>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
