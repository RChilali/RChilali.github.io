<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday | Surprise finale</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page page-congrats">
  <main class="shell shell-celebration" id="celebrationPage">
    <section class="card celebration-card">
      <div class="balloons" aria-hidden="true">
        <span class="balloon balloon-pink"></span>
        <span class="balloon balloon-yellow"></span>
        <span class="balloon balloon-blue"></span>
      </div>

      <p class="eyebrow">Étape 3 sur 3</p>
      <h1>La plus belle surprise !</h1>

      <div class="cake" aria-hidden="true">
        <div class="cake-top"></div>
        <div class="cake-middle"></div>
        <div class="cake-bottom"></div>
        <div class="candle"></div>
        <div class="flame"></div>
      </div>

      <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

      <a class="primary-btn secondary-btn" href="index.html">Recommencer</a>
    </section>

  <script src="js/app.js"></script>
