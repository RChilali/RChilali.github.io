<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Joyeux anniversaire</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page page-login">
  <main class="shell">
    <section class="card intro-card">
      <p class="eyebrow">Étape 1 sur 3</p>
      <h1>Connexion anniversaire</h1>
      <p class="lead">Entre les identifiants pour ouvrir le parcours festif et découvrir la surprise finale.</p>

      <form id="loginForm" class="form-stack" novalidate>
        <label for="username">Login</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="ex. rayane" required>

        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="lemeilleur" required>

        <p id="loginMessage" class="message" aria-live="polite"></p>
        <button type="submit" class="primary-btn">Se connecter</button>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
